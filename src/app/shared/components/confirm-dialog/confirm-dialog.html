<div class="confirm-dialog-container">
  <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>
  <mat-dialog-content class="dialog-content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button [mat-dialog-close]="false" class="cancel-btn">{{ data.cancelText || 'Cancel' }}</button>
    <button mat-flat-button color="warn" [mat-dialog-close]="true" class="confirm-btn">{{ data.confirmText || 'Delete' }}</button>
  </mat-dialog-actions>
</div>
